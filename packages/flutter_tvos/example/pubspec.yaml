name: flutter_tvos_example
description: Demonstrates usage of the flutter_tvos package.
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tvos:
    path: ../
  # As Flutter 3.50's app template: Material from its own package, which 3.50
  # recommends over the deprecated `package:flutter/material.dart`.
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
