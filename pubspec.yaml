name: flutter_tvos
description: Flutter CLI tool for building and running Flutter apps on Apple TV (tvOS). A custom embedder wrapping Flutter SDK with tvOS-specific build targets, device management, and plugin support.
version: 1.12.0
homepage: https://fluttertv.dev
repository: https://github.com/fluttertv/flutter-tvos
publish_to: "none"

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  analyzer:
  archive:
  # The Dart hooks protocol, used directly rather than through flutter_tools'
  # translation layer: that layer maps flutter_tools' own closed set of target
  # platforms onto the protocol, and tvOS is not in it, so a build routed
  # through it introduces itself as iOS. Driving the protocol here is what lets
  # tvOS name itself — see lib/build_targets/tvos_hooks.dart.
  #
  # These ranges must keep admitting the exact versions flutter_tools pins, so
  # the tool resolves one copy of each, and the Flutter SDK checkout is never
  # patched (see bin/internal/shared.sh). flutter_tools pins code_assets 2.1.0
  # from Flutter 3.50.0 on (3.47.x pinned 1.x), so the range is 2.x.
  code_assets: ^2.1.0
  data_assets: ^0.20.0
  hooks: ^2.0.2
  hooks_runner: ^1.5.0
  flutter_tools:
    path: flutter/packages/flutter_tools
  # The doctor's result types (ValidationResult and the rest), which
  # flutter_tools moved into this package of its own in Flutter 3.50. A path
  # into the pinned SDK, as flutter_tools itself resolves it.
  flutter_tools_core:
    path: flutter/packages/flutter_tools/packages/flutter_tools_core
  file:
  http:
  # The logger type the hooks protocol hands its extensions (see
  # TvosCodeAssetExtension.setupLogger in lib/build_targets/tvos_hooks.dart).
  logging:
  meta:
  package_config:
  path:
  process:
  unified_analytics:
  vm_service:
  yaml:

dev_dependencies:
  args:
  fake_async:
  file_testing:
  pubspec_parse:
  test:

dependency_overrides:
  meta: ^1.17.0
