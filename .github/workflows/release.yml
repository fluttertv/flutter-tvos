name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on tags like v1.0.0, v1.1.0

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Flutter SDK
        run: |
          FLUTTER_COMMIT=$(cat bin/internal/flutter.version | tr -d '[:space:]')
          git clone --depth=1 https://github.com/flutter/flutter.git
          cd flutter
          # --tags is required so `git describe --tags` can resolve the SDK
          # version. Without it the checkout reports 0.0.0-unknown, which
          # `dart test` does not care about but `flutter test` does: it runs
          # pub resolution, and any package with a `flutter:` SDK constraint
          # fails version solving. Same reason bin/internal/shared.sh passes it.
          git fetch --depth=1 --tags origin "$FLUTTER_COMMIT"
          git checkout "$FLUTTER_COMMIT"

      - name: Resolve dependencies
        run: flutter/bin/dart pub get

      - name: Run tests
        # PUB_OFFLINE=1 avoids a flaky pub.dev advisory race in Dart SDK
        # 3.11.1 (`Bad state: Attempting to send request on closed
        # client`) that `dart test` can otherwise trigger via its
        # implicit `Entrypoint.ensureUpToDate`. Deps are already cached
        # from the previous step.
        #
        # TMPDIR is resolved through its symlinks for the FS guard in Flutter's
        # test harness — see the matching step in test.yml and test/README.md.
        env:
          PUB_OFFLINE: "1"
        run: |
          TMPDIR="$(cd "${TMPDIR:-/tmp}" && pwd -P)" flutter/bin/dart test test/

      # Path-scoped to the root suite, so the bundled package's 103 widget
      # tests need their own step with the flutter runner. See test.yml.
      - name: Run package tests
        working-directory: packages/flutter_tvos
        run: ../../flutter/bin/flutter test

      - name: Run dart analyze
        run: flutter/bin/dart analyze lib/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: fluttertv/flutter-tvos
        run: |
          set -euo pipefail
          : "${VERSION:?the tag gave no version}"

          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            # Created before: by an earlier run, with the tag moved since, or by
            # hand. Nothing to create, but a release made without the flag below
            # can still hold Latest, and only a run here would notice.
            latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
            if [ "$latest" = "$VERSION" ]; then
              echo "::error::$VERSION holds the Latest badge; this is a maintenance line."
              echo "Repair: mark the current line's newest release Latest, e.g."
              echo "  gh release edit <its tag> --latest --repo $REPO"
              exit 1
            fi
            echo "Release $VERSION already exists; skipping creation."
            exit 0
          fi

          # This line is maintenance, so its releases must not take "Latest"
          # from the current line. gh sends no make_latest unless --latest is
          # given, and the API then defaults it to true. `gh release create
          # --help` describes a date-and-version rule instead, which is not what
          # gh sends, so --latest=false is not a no-op.
          gh release create "$VERSION" \
            --title "flutter-tvos $VERSION" \
            --notes "See [CHANGELOG.md](https://github.com/$REPO/blob/$VERSION/CHANGELOG.md) for release notes." \
            --latest=false \
            --repo "$REPO"
