name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on tags like v1.0.0, v1.1.0
  # Called by Tag release once the version on main gains a tag. That workflow
  # pushes the tag with GITHUB_TOKEN, which deliberately does NOT trigger the
  # `push: tags` path above — GitHub suppresses workflow triggers from its own
  # token — so this entry point is how the release actually gets built, and the
  # suppression stops the two paths from racing to create the same release.
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag to build the release for.
        required: true
        type: string

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write   # needed to create GitHub Releases and upload assets

    steps:
      - uses: actions/checkout@v4
        with:
          # Under workflow_call the caller's ref is checked out by default,
          # which is main — close enough today, but it would silently build
          # whatever main became if it moved between the tag and this job.
          ref: ${{ inputs.tag || github.ref }}

      - name: Fetch Flutter SDK
        run: |
          FLUTTER_COMMIT=$(cat bin/internal/flutter.version | tr -d '[:space:]')
          git clone --depth=1 https://github.com/flutter/flutter.git
          cd flutter
          # --tags is required so `git describe --tags` can resolve the SDK
          # version. Without it the checkout reports 0.0.0-unknown, which
          # `dart test` does not care about but `flutter test` does: it runs
          # pub resolution, and any package with a `flutter:` SDK constraint
          # fails version solving. Same reason bin/internal/shared.sh passes it.
          git fetch --depth=1 --tags origin "$FLUTTER_COMMIT"
          git checkout "$FLUTTER_COMMIT"

      - name: Resolve dependencies
        run: flutter/bin/dart pub get

      - name: Run tests
        # PUB_OFFLINE=1 avoids a flaky pub.dev advisory race in Dart SDK
        # 3.11.1 (`Bad state: Attempting to send request on closed
        # client`) that `dart test` can otherwise trigger via its
        # implicit `Entrypoint.ensureUpToDate`. Deps are already cached
        # from the previous step.
        #
        # TMPDIR is resolved through its symlinks for the FS guard in Flutter's
        # test harness — see the matching step in test.yml and test/README.md.
        env:
          PUB_OFFLINE: "1"
        run: |
          TMPDIR="$(cd "${TMPDIR:-/tmp}" && pwd -P)" flutter/bin/dart test test/

      # Path-scoped to the root suite, so the bundled package's 103 widget
      # tests need their own step with the flutter runner. See test.yml.
      - name: Run package tests
        working-directory: packages/flutter_tvos
        run: ../../flutter/bin/flutter test

      # Both halves of the gate in test.yml, so a tag cannot ship what a pull
      # request would have been stopped for. Analyzing lib/ alone here would
      # have let a lint inside packages/flutter_tvos block a PR and not a tag.
      - name: Run dart analyze
        run: flutter/bin/dart analyze --fatal-infos lib/ test/ bin/

      - name: Analyze packages/flutter_tvos
        working-directory: packages/flutter_tvos
        run: ../../flutter/bin/flutter analyze --fatal-infos

      - name: Extract version from tag
        id: version
        # GITHUB_REF_NAME is the tag when triggered by a tag push, but the
        # caller's branch under workflow_call, so the input wins when present.
        run: echo "version=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Collect release notes
        # The tag is v<flutter>-tvos.<cli> and CHANGELOG.md is keyed by the CLI
        # version, so the release page carries that entry's body verbatim and
        # reads the same as the changelog. A tag whose entry is missing still
        # gets a release, with a link instead of a body, rather than no release.
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          CLI_VERSION="${TAG##*-tvos.}"
          FLUTTER_VERSION="${TAG#v}"; FLUTTER_VERSION="${FLUTTER_VERSION%-tvos.*}"
          awk -v v="$CLI_VERSION" '
            /^## \[/ { if (found) exit; found = (index($0, "## [" v "]") == 1); next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no [$CLI_VERSION] entry; the release links to the changelog instead."
            echo "See [CHANGELOG.md](https://github.com/fluttertv/flutter-tvos/blob/main/CHANGELOG.md) for release notes." > release-notes.md
          fi
          printf '\n---\n\nFlutter `%s` · flutter-tvos `%s`. Update with `flutter-tvos upgrade`, or switch lines with `flutter-tvos use %s`.\n' \
            "$FLUTTER_VERSION" "$CLI_VERSION" "$FLUTTER_VERSION" >> release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" --repo fluttertv/flutter-tvos >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists; skipping creation."
            exit 0
          fi

          gh release create "${{ steps.version.outputs.version }}" \
            --title "flutter-tvos ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --repo fluttertv/flutter-tvos
