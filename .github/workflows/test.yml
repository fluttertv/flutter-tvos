name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Flutter SDK
        run: |
          FLUTTER_COMMIT=$(cat bin/internal/flutter.version | tr -d '[:space:]')
          git clone --depth=1 https://github.com/flutter/flutter.git
          cd flutter
          # --tags is required so `git describe --tags` can resolve the SDK
          # version. Without it the checkout reports 0.0.0-unknown, which
          # `dart test` does not care about but `flutter test` does: it runs
          # pub resolution, and any package with a `flutter:` SDK constraint
          # fails version solving. Same reason bin/internal/shared.sh passes it.
          git fetch --depth=1 --tags origin "$FLUTTER_COMMIT"
          git checkout "$FLUTTER_COMMIT"

      # Resolve dependencies before running tests. Without an explicit
      # `pub get` step, `dart test` triggers `Entrypoint.ensureUpToDate`
      # internally, which fetches pub.dev security advisories. The Dart
      # SDK 3.11.1 advisory-fetching code has a race ("Bad state:
      # Attempting to send request on closed client" / "FormatException:
      # advisoriesUpdated must be a String") that intermittently fails
      # the run. Resolving deps explicitly first warms the pub cache and
      # the lockfile so the test step can use --offline below.
      - name: Resolve dependencies
        run: flutter/bin/dart pub get

      - name: Run unit tests
        # PUB_OFFLINE=1 tells pub to skip the advisory fetch in
        # `dart test`'s implicit ensureUpToDate. The deps are already
        # cached from the previous step, so the test still has
        # everything it needs.
        env:
          PUB_OFFLINE: "1"
        run: flutter/bin/dart test test/

      # The step above is path-scoped to the root suite, so the bundled
      # package's 103 tests never ran. They are widget tests and need the
      # flutter runner rather than `dart test`. Among them is
      # rcu/protocol_drift_test.dart, which pins the RCU wire protocol
      # against FlutterTvRemoteProtocol.h — the test most likely to catch
      # engine-side drift on a version bump, and precisely what CI should
      # be checking on a PR that moves the engine.
      - name: Run package tests
        working-directory: packages/flutter_tvos
        run: ../../flutter/bin/flutter test

  analyze:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Flutter SDK
        run: |
          FLUTTER_COMMIT=$(cat bin/internal/flutter.version | tr -d '[:space:]')
          git clone --depth=1 https://github.com/flutter/flutter.git
          cd flutter
          # --tags is required so `git describe --tags` can resolve the SDK
          # version. Without it the checkout reports 0.0.0-unknown, which
          # `dart test` does not care about but `flutter test` does: it runs
          # pub resolution, and any package with a `flutter:` SDK constraint
          # fails version solving. Same reason bin/internal/shared.sh passes it.
          git fetch --depth=1 --tags origin "$FLUTTER_COMMIT"
          git checkout "$FLUTTER_COMMIT"

      - name: Resolve dependencies
        run: flutter/bin/dart pub get

      - name: Run dart analyze
        run: flutter/bin/dart analyze lib/
