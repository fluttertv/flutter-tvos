name: Sync main

# main mirrors dev. Nothing lands on main directly and there is no dev -> main
# pull request: whatever is on dev, once its tests pass, is what main becomes.
#
# The dev -> main PR is what used to cause the recurring conflict. main required
# a linear history while dev's is not linear (it carries merge commits), so such
# a PR could only ever be squashed — and a squash writes a commit onto main that
# exists nowhere in dev's history. main was then 1 ahead, the branches had
# genuinely diverged, and the next round conflicted on the version and CHANGELOG
# files. Fast-forwarding cannot produce that state: main becomes literally dev's
# commit, so the branches can never drift apart in the first place.
#
# required_linear_history is therefore off on main now. A mirror cannot enforce a
# stricter history shape than the branch it mirrors, and keeping it on is what
# forced the squash. main is still protected against force pushes and deletion.
on:
  workflow_run:
    workflows: [Test]
    branches: [dev]
    types: [completed]
  # Recovery hatch: re-run the sync without pushing anything to dev.
  workflow_dispatch:

# Two pushes to dev in quick succession would otherwise race to move main, and
# the loser fails on a stale ref rather than doing anything useful.
concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only mirror a green dev. Without this main would inherit whatever broke,
    # which is the one thing the release branch must not do. workflow_dispatch
    # carries no conclusion, so allow it through explicitly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit whose tests just passed — NOT `dev`, which resolves at
          # job time. Two merges landing close together would otherwise let the
          # gate above approve commit A's Test run while the push carried
          # commit B, whose tests may still be running or may have failed. main
          # would then hold code nothing verified, while the log claimed only a
          # green dev is ever mirrored. workflow_dispatch carries no
          # workflow_run, so fall back to dev there.
          ref: ${{ github.event.workflow_run.head_sha || 'dev' }}
          # A shallow clone cannot prove the push is a fast-forward, so the
          # push below would be rejected for reasons that read like a
          # permissions problem.
          fetch-depth: 0

      - name: Fast-forward main to the tested commit
        run: |
          set -euo pipefail
          # The commit this run validated, not necessarily dev's current tip.
          TESTED_SHA=$(git rev-parse HEAD)
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse origin/main)

          if [ "$TESTED_SHA" = "$MAIN_SHA" ]; then
            echo "main is already at $TESTED_SHA — nothing to do."
            exit 0
          fi

          # main already contains this commit. Normal when two merges land close
          # together and their Test runs finish out of order: the newer commit's
          # sync went first and carried this one along. Nothing to do, and
          # nothing wrong — main is ahead, not diverged.
          if git merge-base --is-ancestor "$TESTED_SHA" "$MAIN_SHA"; then
            echo "main ($MAIN_SHA) already contains $TESTED_SHA — nothing to do."
            exit 0
          fi

          # Refuse to move main backwards. If the tested commit does not contain
          # main's tip, something landed on main outside this workflow and the
          # mirror invariant is already broken; a push here would either fail
          # or, with force, throw that commit away. Fail loudly.
          if ! git merge-base --is-ancestor "$MAIN_SHA" "$TESTED_SHA"; then
            echo "::error::main ($MAIN_SHA) is not an ancestor of $TESTED_SHA."
            echo "Something was committed to main outside this workflow, so the"
            echo "branches have diverged and this is no longer a fast-forward."
            echo "Reconcile them by hand before the mirror can resume."
            exit 1
          fi

          echo "Fast-forwarding main: $MAIN_SHA -> $TESTED_SHA"
          # Deliberately not --force: a plain push is itself the guarantee that
          # this is a fast-forward, so the checks above can never be the only
          # thing standing between a mistake and a rewritten main.
          git push origin "$TESTED_SHA:refs/heads/main"
